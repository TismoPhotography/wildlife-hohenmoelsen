name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Capacitor installieren
        run: npm install

      - name: Web-App fuer Android vorbereiten
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js app-icon.png www/

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Android App-Icon erzeugen
        run: |
          mkdir -p assets
          cp app-icon.png assets/icon.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "#0f1712" \
            --iconBackgroundColorDark "#0f1712"

      - name: Firebase Android konfigurieren
        run: cp google-services.json android/app/google-services.json

      - name: Stabilen Debug-Keystore laden
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.config/.android
          echo "$KEYSTORE_BASE64" | base64 --decode > ~/.config/.android/debug.keystore
          chmod 600 ~/.config/.android/debug.keystore

      - name: SHA-1 des festen Keystores pruefen
        run: |
          keytool -list \
            -v \
            -keystore ~/.config/.android/debug.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias androiddebugkey

      - name: Web-Dateien synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Wildlife-Hohenmoelsen-v13-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
