name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Capacitor installieren
        run: npm install

      - name: Web-App fuer Android vorbereiten
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: SHA-1 anzeigen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew signingReport

      - name: Web-Dateien synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: APK bereitstellen
              uses: actions/upload-artifact@v4
        with:
          name: Wildlife-Hohenmoelsen-v13-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
